name: CI
on:
  pull_request:
  push:
    branches: [main, feature/poc-1]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - run: python -m compileall .
      - run: python -m pip install --upgrade pip pytest openpyxl
      - run: python -m pytest tests/ -q
      - run: echo CI-ok
