name: CI
on:
  pull_request:
  push:
    branches: [main, feature/poc-1, feature/hardening-1]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - run: python -m compileall .
      - run: python -m pip install --upgrade pip pytest openpyxl ruff
      - run: python -m ruff check .
      - run: python -m pytest tests/ -q
      - run: echo CI-ok
